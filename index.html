<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prateung Farm 2569</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<style>
/* The two dashboards are whole documents with their own resets, fonts and
   globals, so they are loaded in a frame rather than inlined. Nothing here can
   collide with either of them, and each one keeps working on its own URL. */
:root{
  color-scheme: light dark;
  --font: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
  --page:#f9f9f7; --surface:#fcfcfb; --text:#0b0b0b; --muted:#898781;
  --border:rgba(0,0,0,.12); --chip:#f0efec; --accent:#2a78d6; --accent-ink:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0d0d0d; --surface:#1a1a19; --text:#fff; --muted:#898781;
    --border:rgba(255,255,255,.10); --chip:#232322; --accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  --page:#0d0d0d; --surface:#1a1a19; --text:#fff; --muted:#898781;
  --border:rgba(255,255,255,.10); --chip:#232322; --accent:#3987e5;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; display:flex; flex-direction:column;
  font-family:var(--font); background:var(--page); color:var(--text);
  -webkit-font-smoothing:antialiased;
}
header{
  flex:0 0 auto; display:flex; align-items:center; gap:18px;
  padding:10px 18px; background:var(--surface);
  border-bottom:1px solid var(--border); flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto}
.brand h1{margin:0; font-size:15px; font-weight:700; letter-spacing:-.01em}
.brand span{font-size:12.5px; color:var(--muted)}
nav{display:flex; gap:6px}
.tab{
  font:inherit; font-size:13px; font-weight:600; cursor:pointer;
  padding:7px 15px; border-radius:999px;
  border:1px solid var(--border); background:transparent; color:var(--muted);
  transition:background .15s, color .15s, border-color .15s;
}
.tab:hover{color:var(--text); border-color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.open{
  font-size:12.5px; color:var(--muted); text-decoration:none;
  border-bottom:1px solid transparent; padding-bottom:1px;
}
.open:hover{color:var(--text); border-bottom-color:var(--muted)}
.frame{flex:1 1 auto; position:relative; min-height:0}
iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:block}
@media (max-width:640px){
  .brand span{display:none}
  header{padding:8px 12px; gap:10px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Prateung Farm 2569</h1>
    <span>Herd evaluation &middot; Jan to Jul 2569 (2026)</span>
  </div>
  <nav role="tablist" aria-label="Dashboard version">
    <button class="tab" role="tab" id="tab-legacy"  aria-selected="true"  data-view="legacy">Legacy v7.4</button>
    <button class="tab" role="tab" id="tab-current" aria-selected="false" data-view="current">Dashboard 2569</button>
  </nav>
  <a class="open" id="open" href="legacy.html" target="_blank" rel="noopener">Open in a new tab &#8599;</a>
</header>

<div class="frame">
  <iframe id="view" title="Legacy v7.4" src="legacy.html"></iframe>
</div>

<script>
/* legacy is the landing view; the current dashboard is one tab away */
var VIEWS = {
  legacy:  { file: 'legacy.html',    title: 'Legacy v7.4',    doc: 'Prateung Farm — Legacy v7.4' },
  current: { file: 'dashboard.html', title: 'Dashboard 2569', doc: 'Prateung Farm 2569' }
};
var DEFAULT = 'legacy';

var frame = document.getElementById('view');
var open  = document.getElementById('open');
var tabs  = [].slice.call(document.querySelectorAll('.tab'));

function show(key, push) {
  /* resolve first: an unknown hash has to fall back before the tab state is set,
     or the content loads correctly while no tab shows as selected */
  if (!VIEWS[key]) key = DEFAULT;
  var v = VIEWS[key];
  if (frame.getAttribute('src') !== v.file) frame.setAttribute('src', v.file);
  frame.setAttribute('title', v.title);
  open.setAttribute('href', v.file);
  tabs.forEach(function (t) { t.setAttribute('aria-selected', t.dataset.view === key ? 'true' : 'false'); });
  document.title = v.doc;
  if (push && location.hash.slice(1) !== key) location.hash = key;
}

tabs.forEach(function (t) {
  t.addEventListener('click', function () { show(t.dataset.view, true); });
});

/* the hash makes each version linkable and survives a reload */
window.addEventListener('hashchange', function () { show(location.hash.slice(1) || DEFAULT, false); });
show(location.hash.slice(1), false);
</script>

</body>
</html>
